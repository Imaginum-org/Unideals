name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (syntax + integration tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json
      # mongodb-memory-server downloads a MongoDB binary on first use; cache it.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('backend/package-lock.json') }}
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Dependency audit (prod deps, high+)
        run: npm audit --omit=dev --audit-level=high

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Non-blocking until the remaining lint errors are fixed; remove
      # continue-on-error once `npm run lint` is clean.
      - run: npm run lint
        continue-on-error: true
      - run: npm run build
        env:
          VITE_API_BASE_URL: https://api.example.invalid
      # Report-only: the open finding (@grpc/grpc-js via firebase) is server-side
      # code not shipped to browsers, and its only fix is a breaking upgrade.
      - name: Dependency audit (prod deps, high+)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
